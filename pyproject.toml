[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyresumidor"
version = "0.1.0"
description = "Toolkit de edicao de codigo assistida por IA (mapear, extrair, aplicar) com minimo de contexto/tokens."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Iury Zottele Medeiros" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
gui = ["PySide6>=6.5"]

[project.scripts]
pyresumidor = "pyresumidor.cli.main:main"

[tool.setuptools.packages.find]
include = ["pyresumidor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
